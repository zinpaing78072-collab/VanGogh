<script src="data.js"></script>
<script src="favorites.js"></script>
<script>
(function () {
  "use strict";

  var state = { domain: "all", query: "" };
  var logMain = document.getElementById("logMain");
  var snapshot = document.getElementById("snapshot");
  var tabs = document.getElementById("domainTabs");
  var search = document.getElementById("logSearch");
  var totalCount = document.getElementById("totalCount");

  function renderTabs() {
    var counts = VG.domainCounts(VG.all());
    var labels = { all: "All", movie: "Movies", music: "Music", book: "Books", game: "Games" };
    tabs.innerHTML = ["all", "movie", "music", "book", "game"].map(function (key) {
      return '<button type="button" class="domain-tab" data-domain="' + key + '" aria-pressed="' +
        (state.domain === key) + '">' +
        (key === "all" ? "" : '<span class="domain-dot"></span>') +
        labels[key] + ' <span class="n">' + counts[key] + "</span></button>";
    }).join("");
  }

  function meterRow(label, value, max, colour) {
    var pct = max ? Math.round((value / max) * 100) : 0;
    return '<div class="meter-row"><span>' + VG.esc(label) + '</span><span class="n">' + value + "</span></div>" +
      '<div class="meter" data-domain="' + (colour || "") + '"><span style="--w:' + pct + '%"></span></div>';
  }

  function renderSnapshot(items) {
    var total = items.length || 1;
    var counts = VG.domainCounts(items);
    var tags = VG.tagCounts(items).slice(0, 8);
    var decades = {};
    items.forEach(function (item) {
      var decade = Math.floor(item.year / 10) * 10;
      decades[decade] = (decades[decade] || 0) + 1;
    });
    var topDecades = Object.keys(decades).map(Number).sort(function (a, b) { return decades[b] - decades[a]; }).slice(0, 4);
    var strength = items.length
      ? Math.min(97, 52 + tags.length * 2 + VG.DOMAIN_ORDER.filter(function (key) { return counts[key]; }).length * 4)
      : "—";

    var mix = VG.DOMAIN_ORDER.map(function (key) {
      var d = VG.DOMAINS[key];
      return meterRow(d.label, counts[key], total, key);
    }).join("");

    snapshot.innerHTML =
      '<p class="section-label">Taste snapshot</p>' +
      '<div class="snapshot-score"><strong>' + strength + '</strong><span>signal<br>strength</span></div>' +
      '<p class="snapshot-sub">' + (items.length
        ? items.length + " saved · " + VG.DOMAIN_ORDER.filter(function (key) { return counts[key]; }).length +
          " forms · " + tags.length + " vibes"
        : "No signal in this cut") + "</p>" +
      '<div class="snapshot-block"><p class="peek-label">Form mix</p>' + mix + "</div>" +
      '<div class="snapshot-block"><p class="peek-label">Top vibes</p><div class="snapshot-tags">' +
        (tags.length ? tags.map(function (entry) {
          return '<span class="tag">' + VG.esc(entry.tag) + " " + entry.count + "</span>";
        }).join("") : '<span class="tag">No vibes yet</span>') +
      "</div></div>" +
      '<div class="snapshot-block"><p class="peek-label">Decades</p>' +
        (topDecades.length ? topDecades.map(function (decade) {
          return '<div class="meter-row"><span>' + decade + 's</span><span class="n">' + decades[decade] + "</span></div>" +
            '<div class="meter"><span style="--w:' + Math.round((decades[decade] / total) * 100) + '%"></span></div>';
        }).join("") : '<p class="snapshot-sub">Nothing to measure yet.</p>') +
      "</div>" +
      '<div class="snapshot-cta"><p>Favorites are the strongest signal the engine gets. Turn this log into a fresh set of picks.</p>' +
        '<a class="nbtn primary" href="v4-mixer.html">Compose picks →</a></div>';
  }

  function render() {
    var items = VG.filterItems(VG.all(), state);
    items = VG.sortItems(items, "recent");
    totalCount.textContent = VG.all().length;
    renderTabs();
    renderSnapshot(items);

    if (!items.length) {
      logMain.innerHTML = VG.emptyHTML({
        kicker: VG.all().length ? "No matches" : "Log empty",
        title: VG.all().length ? "Nothing in this cut" : "No signal yet",
        body: VG.all().length
          ? "Try another form or a different search term."
          : "Save a few favorites and this page becomes a record of what you kept.",
        cta: "Back to the gallery",
        href: "index.html"
      });
      return;
    }

    var groups = VG.groupByDate(items);
    logMain.innerHTML = groups.map(function (group) {
      return '<section class="log-group">' +
        '<div class="log-date">' + VG.esc(group.label) + ' <span class="n">' + group.items.length + "</span></div>" +
        '<div class="log-list">' +
          group.items.map(function (item, index) {
            return VG.rowHTML(item, index, { className: "log-row" });
          }).join("") +
        "</div>" +
      "</section>";
    }).join("");
  }

  tabs.addEventListener("click", function (event) {
    var tab = event.target.closest("[data-domain]");
    if (!tab) return;
    state.domain = tab.getAttribute("data-domain");
    render();
  });

  search.addEventListener("input", function () {
    state.query = search.value;
    render();
  });

  document.addEventListener("favorites:change", render);

  render();
})();
</script>
