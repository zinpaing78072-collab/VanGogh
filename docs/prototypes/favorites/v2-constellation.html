          <h1 class="page-title">Constellation <span class="count" id="totalCount">35</span></h1>
          <p class="page-lede">Your favorites arranged into <strong>collections</strong>. Drag a card onto a lane to file it; everything else waits in Unfiled.</p>
        </div>
        <div class="page-actions">
          <button type="button" class="nbtn" id="newCollection">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New collection
          </button>
        </div>

      <div class="collections-layout">

          <p class="section-label">Index</p>
          <div id="collectionNav"></div>

        <div id="lanes"></div>
      </div>
    </main>

<script src="data.js"></script>
<script src="favorites.js"></script>
<script>
(function () {
  "use strict";

  var collections = window.COLLECTIONS || [];
  var summary = document.getElementById("collectionSummary");
  var nav = document.getElementById("collectionNav");
  var lanes = document.getElementById("lanes");
  var totalCount = document.getElementById("totalCount");

  function laneHTML(collection) {
    var items = VG.all().filter(function (item) {
      return (item.collection || null) === (collection ? collection.id : null);
    });
    var id = collection ? collection.id : "";
    var title = collection ? collection.title : "Unfiled";
    var colour = collection ? collection.colour : "#9A8ABF";
    var blurb = collection ? collection.blurb : "Kept, not filed yet. Drag a card into a collection.";
    var cards = items.map(function (item, index) {
      return VG.cardHTML(item, index, { draggable: true });
    }).join("");
    return (
      '<section class="collection-lane" id="lane-' + (id || "unfiled") + '">' +
        '<div class="lane-head">' +
          "<div>" +
            '<div class="lane-title"><span class="collection-swatch" style="--c:' + colour + '"></span>' +
              VG.esc(title) + ' <span class="n">' + items.length + "</span></div>" +
            '<p class="lane-desc">' + VG.esc(blurb) + "</p>" +
          "</div>" +
          '<div class="lane-head-actions">' +
            '<button type="button" class="mini-btn" data-add="' + (id || "unfiled") + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add' +
            "</button>" +
          "</div>" +
        "</div>" +
        '<div class="lane-rail" data-drop="' + id + '" role="list" aria-label="' + VG.esc(title) + ' favorites">' +
          (cards || '<div class="lane-empty">Drop a favorite here</div>') +
        "</div>" +
      "</section>"
    );
  }

  function render() {
    var items = VG.all();
    var counts = VG.collectionCounts(items);
    totalCount.textContent = items.length;

    summary.innerHTML = collections.map(function (c) {
      return '<button type="button" class="collection-tile" data-jump="' + c.id + '" style="--c:' + c.colour + '">' +
        '<span class="collection-swatch"></span>' +
        '<span class="n">' + (counts[c.id] || 0) + "</span>" +
        "<strong>" + VG.esc(c.title) + "</strong>" +
        "<span>" + VG.esc(c.blurb) + "</span>" +
        "</button>";
    }).join("");

    nav.innerHTML =
      '<button type="button" data-jump="all" class="active"><span class="collection-swatch" style="--c:#FF2E97"></span>' +
        'All collections <span class="n">' + items.length + "</span></button>" +
      collections.map(function (c) {
        return '<button type="button" data-jump="' + c.id + '"><span class="collection-swatch" style="--c:' +
          c.colour + '"></span>' + VG.esc(c.title) + ' <span class="n">' + (counts[c.id] || 0) + "</span></button>";
      }).join("") +
      '<button type="button" data-jump="unfiled"><span class="collection-swatch" style="--c:#9A8ABF"></span>' +
        'Unfiled <span class="n">' + counts.unfiled + "</span></button>";

    lanes.innerHTML = collections.map(function (c) { return laneHTML(c); }).join("") +
      laneHTML(null);
  }

  function jump(id) {
    var lane = document.getElementById("lane-" + (id === "all" ? collections[0].id : id));
    if (lane) lane.scrollIntoView({ behavior: "smooth", block: "start" });
    nav.querySelectorAll("[data-jump]").forEach(function (button) {
      button.classList.toggle("active", button.getAttribute("data-jump") === id);
    });
  }

  document.addEventListener("click", function (event) {
    var jumpButton = event.target.closest("[data-jump]");
    if (jumpButton) {
      jump(jumpButton.getAttribute("data-jump"));
      return;
    }
    var add = event.target.closest("[data-add]");
    if (add) {
      VG.toast("Drag a favorite from any lane onto this one to file it");
      return;
    }
    if (event.target.closest("#newCollection") || event.target.closest("#newCollectionInline")) {
      VG.toast("Creating collections is not wired in this prototype");
    }
  });

  lanes.addEventListener("dragstart", function (event) {
    var card = event.target.closest("[data-fav-card]");
    if (!card) return;
    event.dataTransfer.setData("text/plain", card.getAttribute("data-id"));
    event.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });

  lanes.addEventListener("dragend", function (event) {
    var card = event.target.closest("[data-fav-card]");
    if (card) card.classList.remove("dragging");
    lanes.querySelectorAll(".drag-over").forEach(function (rail) { rail.classList.remove("drag-over"); });
  });

  lanes.addEventListener("dragover", function (event) {
    var rail = event.target.closest("[data-drop]");
    if (!rail) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "move";
    rail.classList.add("drag-over");
  });

  lanes.addEventListener("dragleave", function (event) {
    var rail = event.target.closest("[data-drop]");
    if (rail && !rail.contains(event.relatedTarget)) rail.classList.remove("drag-over");
  });

  lanes.addEventListener("drop", function (event) {
    var rail = event.target.closest("[data-drop]");
    if (!rail) return;
    event.preventDefault();
    rail.classList.remove("drag-over");
    var id = event.dataTransfer.getData("text/plain");
    var target = rail.getAttribute("data-drop") || null;
    if (id) VG.moveToCollection(id, target);
  });

  document.addEventListener("favorites:change", render);

  render();
})();
</script>
</body>
</html>
