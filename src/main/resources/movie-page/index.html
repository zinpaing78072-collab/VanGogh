<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Gogh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Starry Night backdrop: starry.png behind a frosted veil -->
<div class="sky" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<div class="app-shell">
    <!-- Sidebar: brand + collapse toggle, the content-form switcher, and the
         not-yet-wired areas. Collapsing it hands the width back to the card
         grid; the buttons are the only way to switch content form (no filter
         dropdown — a native <select> popup freezes the macOS window). -->
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar-head">
            <div class="brand"><span class="brand-mark" aria-hidden="true">✶</span><span class="brand-text">Van Gogh</span></div>
            <button type="button" id="sidebarToggle" class="icon-btn sidebar-toggle"
                    aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar"
                    title="Collapse sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="16" rx="2"/>
                    <path d="M9 4v16"/>
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav" id="sidebarNav" aria-label="Main navigation">
            <p class="nav-label">Menu</p>

            <button type="button" class="nav-item" data-nav="home" aria-disabled="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 10.5 12 3l9 7.5"/>
                    <path d="M5 9.5V21h14V9.5"/>
                </svg>
                <span class="nav-text">Home</span>
            </button>

            <!-- Content-form buttons: data-domain is the IPC selector and the
                 active marker (render.js toggles .active from state.domain). -->
            <button type="button" class="nav-item" data-domain="music">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>
                <span class="nav-text">Music</span>
            </button>
            <button type="button" class="nav-item" data-domain="movie">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/>
                </svg>
                <span class="nav-text">Movies</span>
            </button>
            <button type="button" class="nav-item" data-domain="book">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span class="nav-text">Books</span>
            </button>
            <button type="button" class="nav-item" data-domain="game">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="6" width="20" height="12" rx="4"/>
                    <path d="M6.5 12h4M8.5 10v4"/>
                    <path d="M16 10.5h.01M18.5 13.5h.01"/>
                </svg>
                <span class="nav-text">Games</span>
            </button>

            <!-- Library is a section label, like Menu — not a destination. -->
            <p class="nav-label nav-label-spaced">Library</p>

            <button type="button" class="nav-item" data-nav="lists" aria-disabled="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 6h13M8 12h13M8 18h13"/>
                    <path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>
                </svg>
                <span class="nav-text">My Lists</span>
            </button>
            <button type="button" class="nav-item" data-nav="favorites" aria-disabled="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.6 8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>
                </svg>
                <span class="nav-text">Favorites</span>
            </button>
        </nav>

        <div class="sidebar-foot">
            <button type="button" class="nav-item" data-nav="settings" aria-disabled="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span class="nav-text">Settings</span>
            </button>
        </div>
    </aside>

    <div class="main-column">
        <header class="app-header">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search movies, books, music, games…">
                <!-- AI mode: the search box asks the LLM for recommendations and
                     resolves the picks against the active form's catalog. Off by
                     default; a plain button, never a native popup (the macOS
                     NSMenu trap). -->
                <button type="button" id="aiToggle" class="ai-toggle" aria-pressed="false"
                        aria-label="AI recommendations" title="AI recommendations off">AI</button>
                <button id="searchBtn" class="search-btn">Search</button>
            </div>

            <!-- Notifications + profile: shell chrome only (no backend yet),
                 top-right of the header. -->
            <div class="quick-actions">
                <button type="button" class="icon-btn round" aria-label="Notifications"
                        aria-disabled="true" title="Notifications (coming soon)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn round avatar" aria-label="Profile"
                        aria-disabled="true" title="Profile (coming soon)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21v-1a8 8 0 0 1 16 0v1"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="container">
            <section class="trending-section">
                <h2 class="section-title" id="sectionTitle">Trending Movies</h2>
                <div class="card-grid" id="movieGrid">
                    <!-- Movie cards injected by JS -->
                </div>
            </section>
        </main>
    </div>
</div>

<script src="krema-shim.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
