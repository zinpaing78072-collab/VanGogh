<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Gogh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
    <div class="brand">Van Gogh</div>
    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search movies, books, music, games…">
        <button id="searchBtn" class="search-btn">Search</button>
    </div>
    <div class="filter-wrapper">
        <div id="contentFilter" class="filter-select" tabindex="0" role="listbox" aria-label="Content type filter">
            <span id="contentFilterLabel">Movie</span>
            <div id="contentFilterMenu" class="filter-menu hidden">
                <div class="filter-option selected" data-value="movie">Movie</div>
                <div class="filter-option" data-value="music">Music</div>
                <div class="filter-option" data-value="book">Book</div>
                <div class="filter-option" data-value="game">Game</div>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <section class="trending-section">
        <h2 class="section-title" id="sectionTitle">Trending Movies</h2>
        <div class="card-grid" id="movieGrid">
            <!-- Movie cards injected by JS -->
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
